<!DOCTYPE html>
<html lang="es" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#155e4b">
    <title>LocalShop</title>
    <style>
        :root { color-scheme: light; font-family: Arial, sans-serif; color: #17352d; background: #f5f7f4; }
        body { margin: 0; }
        header { padding: 2.5rem 1.25rem; color: white; text-align: center; background: #155e4b; }
        main { max-width: 1080px; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
        h2 { margin-top: 0; }
        .catalogo { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1rem; }
        .producto, form { padding: 1.25rem; border-radius: .75rem; background: white; box-shadow: 0 2px 8px #17352d1a; }
        .producto img { width: 100%; height: 145px; margin-bottom: 1rem; border-radius: .5rem; object-fit: cover; background: #e6ece8; }
        .producto h3 { margin: 0 0 .5rem; }
        .producto p { min-height: 3rem; color: #4d5d57; }
        .precio { color: #155e4b; font-size: 1.2rem; font-weight: bold; }
        section { margin-top: 2.5rem; }
        form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
        label { display: grid; gap: .4rem; font-weight: bold; }
        input, textarea, button { box-sizing: border-box; padding: .7rem; border: 1px solid #b8c7c0; border-radius: .4rem; font: inherit; }
        textarea, .ancho-completo { grid-column: 1 / -1; }
        button { border: 0; color: white; cursor: pointer; background: #155e4b; }
        @media (max-width: 600px) { form { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<header>
    <h1>LocalShop</h1>
    <p>Productos locales, cerca de ti.</p>
</header>
<main>
    <section>
        <h2>Catálogo</h2>
        <div class="catalogo">
            <article class="producto" th:each="producto : ${productos}">
                <img th:if="${producto.imagenUrl != null and !producto.imagenUrl.isBlank()}"
                     th:src="${producto.imagenUrl}" th:alt="${producto.nombre}">
                <h3 th:text="${producto.nombre}">Producto</h3>
                <p th:text="${producto.descripcion}">Descripción del producto.</p>
                <span class="precio" th:text="${'$' + #numbers.formatDecimal(producto.precio, 1, 2)}">$0.00</span>
            </article>
        </div>
    </section>

    <section>
        <h2>Registrar producto</h2>
        <form action="/productos" method="post">
            <label>Nombre
                <input name="nombre" required maxlength="255">
            </label>
            <label>Precio
                <input name="precio" type="number" min="0" step="0.01" required>
            </label>
            <label class="ancho-completo">Descripción
                <textarea name="descripcion" required maxlength="1000" rows="3"></textarea>
            </label>
            <label class="ancho-completo">URL de imagen (opcional)
                <input name="imagenUrl" type="url" maxlength="1000">
            </label>
            <button class="ancho-completo" type="submit">Guardar producto</button>
        </form>
    </section>
</main>
<script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
    }
</script>
</body>
</html>
